<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://127.0.0.1:5173"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vyrnex Studio</title>
</head>
<body class="has-sidebar">
  <div id="app">
    <div id="workbench">
      <aside id="sidebar">
        <div class="sidebar-header">
          <div class="view-switch" role="tablist">
            <button class="view-tab" data-view="explorer" role="tab" aria-selected="true">Explorer</button>
            <button class="view-tab" data-view="search" role="tab" aria-selected="false" title="Search in Files (Ctrl+Shift+F)">Search</button>
          </div>
          <div class="sidebar-actions">
            <button id="btn-open-folder" class="icon-btn" title="Open Folder (Ctrl+Shift+O)" aria-label="Open Folder">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4.5v8h13V5.5H7.5l-1.5-2H1.5z" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-refresh" class="icon-btn" title="Refresh" aria-label="Refresh Explorer">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div id="explorer"></div>
        <div id="search-view">
          <div class="search-box">
            <input id="search-input" type="text" placeholder="Search in project" spellcheck="false" autocomplete="off" />
            <button id="search-case" class="icon-btn" aria-pressed="false" title="Match Case" aria-label="Match Case">Aa</button>
          </div>
          <div id="search-status"></div>
          <div id="search-results"></div>
        </div>
      </aside>
      <div id="splitter" role="separator" aria-orientation="vertical"></div>
      <main id="main">
        <div id="tabs" role="tablist"></div>
        <div id="editor-wrap">
          <div id="editor"></div>
          <div id="welcome">
            <div class="welcome-box">
              <h1>Vyrnex Studio</h1>
              <ul>
                <li><button data-action="new-file">New File</button><kbd>Ctrl+N</kbd></li>
                <li><button data-action="open-file">Open File</button><kbd>Ctrl+O</kbd></li>
                <li><button data-action="open-folder">Open Folder</button><kbd>Ctrl+Shift+O</kbd></li>
                <li><button data-action="quick-open">Go to File</button><kbd>Ctrl+P</kbd></li>
                <li><button data-action="toggle-terminal">Terminal</button><kbd>Ctrl+J</kbd></li>
                <li><button data-action="command-palette">Command Palette</button><kbd>F1</kbd></li>
              </ul>
              <p>Drag files or folders into this window to open them.</p>
            </div>
          </div>
        </div>
        <div id="panel-splitter" role="separator" aria-orientation="horizontal"></div>
        <section id="panel" aria-label="Terminal">
          <div class="panel-header">
            <div id="term-tabs" role="tablist"></div>
            <div class="panel-actions">
              <button id="term-new" class="icon-btn" title="New Terminal (Ctrl+Shift+J)" aria-label="New Terminal">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
              </button>
              <button id="term-hide" class="icon-btn" title="Hide Terminal (Ctrl+J)" aria-label="Hide Terminal">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div id="terminals"></div>
        </section>
      </main>
    </div>
    <footer id="statusbar">
      <div class="status-left">
        <button id="st-terminal" class="st-btn" title="Toggle Terminal (Ctrl+J)">Terminal</button>
        <span id="st-folder"></span>
        <span id="st-msg"></span>
      </div>
      <div class="status-right">
        <span id="st-autosave" class="st-item" hidden>Auto Save</span>
        <button id="st-pos" class="st-btn" title="Go to Line (Ctrl+G)">Ln 1, Col 1</button>
        <span id="st-sel"></span>
        <span class="st-item">UTF-8</span>
        <button id="st-eol" class="st-btn" title="Change Line Ending">LF</button>
        <select id="st-lang" class="st-btn" title="Select Language" aria-label="Language"></select>
      </div>
    </footer>
  </div>

  <div id="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" aria-label="Command palette" />
      <ul id="palette-list" role="listbox"></ul>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="./renderer.ts"></script>
</body>
</html>
